<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enkripsi Ketat v2 – Argon2id + AES-GCM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.3/dist/argon2-bundled.min.js"></script>
<style>
:root{--bg:#0f172a;--neon:#10b981;--neon2:#059669;--glass:rgba(17,24,39,.72)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e2e8f0;font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background-image:radial-gradient(800px 400px at 20% 10%,rgba(16,185,129,.12),transparent),radial-gradient(600px 300px at 80% 90%,rgba(16,185,129,.08),transparent)}
.card{width:100%;max-width:520px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid rgba(16,185,129,.25);border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{margin:0 0 6px;font-size:26px;display:flex;align-items:center;gap:10px}
.badge{font-size:11px;padding:3px 8px;border:1px solid var(--neon);color:var(--neon);border-radius:999px;letter-spacing:.5px}
.sub{color:#94a3b8;font-size:13px;margin-bottom:22px}
label{display:block;margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#cbd5e1;font-weight:600}
input{width:100%;padding:13px 14px;background:#0b1220;border:1px solid #233046;border-radius:12px;color:#e2e8f0;font-size:15px;outline:none}
input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
input[type=file]{padding:10px}
.btn{margin-top:22px;width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--neon),var(--neon2));color:#06291e;font-weight:800;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.6}
.warn{font-size:12px;color:#f59e0b;margin-top:6px;display:none}
.warn.err{color:#f87171}
.status{margin-top:14px;font-size:13px;color:#a7f3d0;display:none}
.result{margin-top:18px;padding:14px;border:1px solid rgba(16,185,129,.3);background:rgba(16,185,129,.07);border-radius:12px;display:none}
a.dl{color:var(--neon);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1><i class="fa-solid fa-shield-halved" style="color:var(--neon)"></i> HTML ENCRYPTOR <span class="badge">PARANOID</span></h1>
  <div class="sub">PBKDF2 100k + Argon2id 64MB + AES-GCM. Magic header 16-byte random. Tidak ada upload.</div>

  <label>File HTML</label>
  <input type="file" id="file" accept=".html,.htm">

  <label>Kata sandi</label>
  <input type="password" id="pwd" placeholder="Boleh 1 karakter seperti 🥳">
  <div class="warn" id="wshort">Saran: gunakan 8+ karakter untuk file publik</div>

  <label>Konfirmasi</label>
  <input type="password" id="pwd2" placeholder="Ulangi">
  <div class="warn err" id="wmatch">Tidak cocok</div>

  <button class="btn" id="go">Enkripsi & Download</button>
  <div class="status" id="st"></div>
  <div class="result" id="res"><div id="resinfo"></div><a class="dl" id="dl" href="#">Download ulang</a></div>
</div>

<script>
const $=id=>document.getElementById(id);
const fileI=$('file'), pwd=$('pwd'), pwd2=$('pwd2'), go=$('go'), st=$('st'), res=$('res'), resinfo=$('resinfo'), dl=$('dl'), wshort=$('wshort'), wmatch=$('wmatch');

pwd.addEventListener('input',()=>{wshort.style.display=pwd.value.length>0 && pwd.value.length<8?'block':'none';check()});
pwd2.addEventListener('input',check);
function check(){wmatch.style.display=pwd2.value && pwd.value!==pwd2.value?'block':'none'}

function b64(buf){let binary='';const bytes=new Uint8Array(buf);const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk){binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk))}return btoa(binary)}
function u8(b64s){const bin=atob(b64s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}

go.onclick=async()=>{
  const f=fileI.files[0]; if(!f){alert('Pilih file dulu');return}
  if(!pwd.value){alert('Isi sandi');return}
  if(pwd.value!==pwd2.value){alert('Konfirmasi beda');return}
  go.disabled=true; res.style.display='none'; st.style.display='block'; st.textContent='Membaca file...';
  try{
    const html=await f.text();
    st.textContent='Membuat kunci...';
    const magic=crypto.getRandomValues(new Uint8Array(16));
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    // PBKDF2 via CryptoJS
    const saltWA=CryptoJS.lib.WordArray.create(salt);
    const pbkdf2=CryptoJS.PBKDF2(pwd.value, saltWA, {keySize:256/32, iterations:100000, hasher:CryptoJS.algo.SHA256}).toString(CryptoJS.enc.Hex);
    st.textContent='Argon2id memory-hard...';
    await new Promise(r=>setTimeout(r,30));
    const argon=await argon2.hash({pass:pbkdf2, salt:salt, time:3, mem:65536, hashLen:32, parallelism:1, type:argon2.ArgonType.Argon2id});
    const key=await crypto.subtle.importKey('raw', argon.hash, {name:'AES-GCM'}, false, ['encrypt']);
    st.textContent='Enkripsi AES-GCM...';
    const ctBuf=await crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, new TextEncoder().encode(html));
    const ct=new Uint8Array(ctBuf);
    const combined=new Uint8Array(16+16+12+ct.length);
    combined.set(magic,0); combined.set(salt,16); combined.set(iv,32); combined.set(ct,44);
    const payload=b64(combined);

    st.textContent='Membangun file terproteksi...';
    const outName=f.name.replace(/\.html?$/i,'')+'-enkripsiketat.html';

    const template = [
'<!DOCTYPE html>',
'<html lang="id">',
'<head>',
'<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">',
'<title>Dokumen Terenkripsi</title>',
'<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">',
'<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"><\/script>',
'<script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.3/dist/argon2-bundled.min.js"><\/script>',
'<style>',
':root{--bg:#0f172a;--neon:#10b981;--glass:rgba(30,41,59,.78)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e2e8f0;font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}',
'.lock{width:100%;max-width:420px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid rgba(16,185,129,.3);border-radius:22px;padding:34px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}',
'.ico{width:70px;height:70px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,var(--neon),#059669);display:flex;align-items:center;justify-content:center;color:#0b1f16;font-size:30px;box-shadow:0 8px 24px rgba(16,185,129,.35)}',
'h1{margin:0 0 6px;font-size:22px}p{margin:0 0 20px;color:#94a3b8;font-size:13px}',
'input{width:100%;padding:13px 14px;background:#0b1220;border:1px solid #243244;border-radius:12px;color:#e2e8f0;outline:none;margin-bottom:10px}',
'input:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(16,185,129,.18)}',
'.btn{width:100%;padding:12px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--neon),#059669);color:#052e1a;font-weight:800;cursor:pointer}',
'.err{min-height:18px;color:#f87171;font-size:13px;margin-top:8px}',
'</style>',
'</head>',
'<body>',
'<div class="lock" id="lock">',
'<div class="ico"><i class="fa-solid fa-lock"></i></div>',
'<h1>Konten Terkunci</h1>',
'<p>PBKDF2 + Argon2id + AES-GCM</p>',
'<input type="password" id="p" placeholder="Masukkan kata sandi" autocomplete="current-password">',
'<button class="btn" id="b">Buka</button>',
'<div class="err" id="e"></div>',
'</div>',
'<script>',
'const DATA="__PAYLOAD__";',
'const KEY="fail_"+DATA.slice(0,20);',
'function u8(b){const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}',
'async function open(){',
' const pw=document.getElementById("p").value; const err=document.getElementById("e"); const btn=document.getElementById("b");',
' err.textContent=""; btn.disabled=true; btn.textContent="Memproses...";',
' let fails=parseInt(localStorage.getItem(KEY)||"0"); if(fails>=5){decoy();return}',
' try{',
'  const all=u8(DATA); const salt=all.slice(16,32); const iv=all.slice(32,44); const ct=all.slice(44);',
'  const saltWA=CryptoJS.lib.WordArray.create(salt);',
'  const pbkdf2=CryptoJS.PBKDF2(pw, saltWA, {keySize:256/32, iterations:100000, hasher:CryptoJS.algo.SHA256}).toString(CryptoJS.enc.Hex);',
'  const argon=await argon2.hash({pass:pbkdf2, salt:salt, time:3, mem:65536, hashLen:32, parallelism:1, type:argon2.ArgonType.Argon2id});',
'  const key=await crypto.subtle.importKey("raw", argon.hash, {name:"AES-GCM"}, false, ["decrypt"]);',
'  const plain=await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct);',
'  const html=new TextDecoder().decode(plain);',
'  localStorage.removeItem(KEY);',
'  const prot="<scr"+"ipt>document.addEventListener(\'contextmenu\',e=>{e.preventDefault()});document.addEventListener(\'selectstart\',e=>e.preventDefault());document.addEventListener(\'copy\',e=>e.preventDefault());document.addEventListener(\'keydown\',e=>{if(e.key===\'F12\'||(e.ctrlKey&&e.shiftKey&&[\'I\',\'J\',\'C\'].includes(e.key.toUpperCase()))||(e.ctrlKey&&[\'U\',\'S\',\'P\'].includes(e.key.toUpperCase()))){e.preventDefault();e.stopPropagation()}});setInterval(()=>{const t=performance.now();debugger;if(performance.now()-t>150){document.documentElement.innerHTML=\'\'}},1200);<\/script><style>*{user-select:none!important;-webkit-user-select:none!important}body{-webkit-touch-callout:none}</style>";',
'  document.open(); document.write(prot+html); document.close();',
' }catch(ex){',
'  fails++; localStorage.setItem(KEY,fails);',
'  if(fails>=5){decoy()}else{err.textContent="Sandi salah. Percobaan "+fails+"/5"; btn.disabled=false; btn.textContent="Buka"}',
' }',
'}',
'function decoy(){',
' document.body.innerHTML=""; document.body.style.margin="0"; document.body.style.background="#0f172a"; document.body.style.overflow="hidden";',
' const w=document.createElement("div"); w.style.position="fixed"; w.style.inset="0"; w.style.background="#0f172a";',
' w.innerHTML=\'<div style="position:absolute;inset:0;background-image:linear-gradient(rgba(16,185,129,.09)1px,transparent 1px),linear-gradient(90deg,rgba(16,185,129,.09)1px,transparent 1px);background-size:56px 56px;animation:p 4s infinite"></div><h1 style="position:relative;z-index:2;color:#10b981;text-align:center;margin-top:22vh;font-size:clamp(28px,7vw,56px);text-shadow:0 0 24px #10b981;letter-spacing:3px">ACCESS GRANTED</h1><p style="position:relative;z-index:2;color:#34d399;text-align:center;opacity:.85;letter-spacing:2px">The Illusion of Success</p>\';',
' document.body.appendChild(w);',
' const s=document.createElement("style"); s.textContent="@keyframes p{0%,100%{opacity:.35}50%{opacity:.75}}@keyframes f{0%{transform:translateY(0) scale(.6) rotate(0);opacity:.2}50%{opacity:1}100%{transform:translateY(-110vh) scale(1.4) rotate(360deg);opacity:0}}"; document.head.appendChild(s);',
' const cols=["#10b981","#34d399","#f59e0b","#ec4899","#3b82f6"]; const icons=["fa-lock","fa-shield-halved","fa-key","fa-fingerprint","fa-eye","fa-bug","fa-skull","fa-ghost","fa-robot","fa-microchip","fa-code","fa-bolt","fa-wifi"];',
' for(let i=0;i<85;i++){const el=document.createElement("i"); el.className="fa-solid "+icons[Math.floor(Math.random()*icons.length)]; el.style.position="absolute"; el.style.left=Math.random()*100+"%"; el.style.top=100+Math.random()*20+"%"; el.style.fontSize=(12+Math.random()*30)+"px"; el.style.color=cols[Math.floor(Math.random()*cols.length)]; el.style.textShadow="0 0 12px currentColor"; el.style.animation="f "+(9+Math.random()*10)+"s linear infinite"; el.style.animationDelay=(-Math.random()*18)+"s"; el.style.zIndex="1"; w.appendChild(el)}',
'}',
'document.getElementById("b").onclick=open; document.getElementById("p").addEventListener("keydown",e=>{if(e.key==="Enter")open()});',
'<\/script>',
'</body>',
'</html>'
].join('\n');

    const finalHtml = template.replace('__PAYLOAD__', payload);
    const blob=new Blob([finalHtml],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    dl.href=url; dl.download=outName; dl.click();
    resinfo.innerHTML='File <b>'+outName+'</b> siap. Payload '+(payload.length/1024).toFixed(1)+' KB';
    res.style.display='block'; st.textContent='Selesai';
  }catch(e){console.error(e); st.textContent='Error: '+e.message; alert('Gagal: '+e.message)}
  finally{go.disabled=false; setTimeout(()=>st.style.display='none',1800)}
}
</script>
</body>
</html>
